packages:
  - packages/*
  - tools/*

# 14 days in minutes: enforces the "released at least ~2 weeks ago" rule for
# every dependency, including transitive ones (docs/research/phase-1-stack.md).
minimumReleaseAge: 20160
# vite 8.3.2 is the version chosen in the research doc; it was published
# 2026-10-01 and is a few hours short of the 14-day window on 2026-10-15.
minimumReleaseAgeExclude:
  - vite@8.3.2

catalog:
  typescript: 7.0.2
  vite: ^8.3.2
  "@vitejs/plugin-react": ^6.1.1
  vitest: ^5.0.3
  react: ^19.3.0
  react-dom: ^19.3.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/node": ^24.19.0
  phaser: 4.2.1
  zod: 4.6.5
